version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: packages/deployment/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:4000
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: packages/deployment/docker/Dockerfile.backend
    ports:
      - "4000:4000"
    env_file:
      - .env

